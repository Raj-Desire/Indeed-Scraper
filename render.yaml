services:
  - type: web
    name: indeed-job-scraper
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && playwright install chromium --with-deps"
    startCommand: "python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: SCRAPER_HEADLESS
        value: "true"
