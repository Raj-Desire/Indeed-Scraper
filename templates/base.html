<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indeed</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' },
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/custom.css?v=3.5">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased">
    <!-- Modern Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="w-full px-6 lg:px-8 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3.5">
                <div id="header-portal-icon" class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center font-black text-white text-base shadow-md shadow-blue-500/20 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <div>
                    <h1 id="header-portal-title" class="text-slate-900 font-extrabold text-lg leading-tight tracking-tight transition-all">Automated Indeed Scraper</h1>
                    <p id="header-portal-subtitle" class="text-slate-500 text-xs font-medium transition-all">Multi-Country Targeted Job Extraction & AI Matching</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-600 shadow-2xs">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="ist-live-clock" class="font-mono text-slate-700">--:--:-- IST</span>
                    <span class="text-[10px] text-slate-400 font-normal">(GMT+5:30)</span>
                </div>
                <button id="nav-download-btn" type="button" onclick="exportExcel(event)" class="hidden px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-xs transition-all shadow-sm hover:shadow flex items-center gap-2 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    Download Excel
                </button>
                <button id="nav-sharepoint-btn" onclick="exportSharePoint()" class="hidden px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs transition-all shadow-sm hover:shadow flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                    Sync to SharePoint
                </button>
            </div>
        </div>
    </header>

    <!-- Full Screen Main Content Area -->
    <main class="w-full flex-1 px-4 sm:px-6 lg:px-8 py-6 space-y-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-slate-200 py-3.5 px-6 text-center text-xs text-slate-400 font-medium">
        Indeed Scraper Dashboard &copy; 2026 • Real-Time Structured Data & Lead Pipeline
    </footer>

    <script src="/static/js/app.js?v=4.1"></script>
</body>
</html>
